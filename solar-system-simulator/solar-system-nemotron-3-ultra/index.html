<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Simulator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      .ui-overlay {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #fff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        pointer-events: none;
        z-index: 10;
      }
      .ui-overlay h1 {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 10px rgba(255, 200, 100, 0.5);
      }
      .ui-overlay .controls {
        font-size: 0.85rem;
        opacity: 0.7;
        line-height: 1.8;
      }
      .ui-overlay .controls kbd {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 0.15em 0.4em;
        font-family: inherit;
        margin: 0 0.2em;
      }
      .planet-info {
        position: fixed;
        bottom: 20px;
        right: 20px;
        color: #fff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1rem 1.5rem;
        min-width: 220px;
        pointer-events: none;
        z-index: 10;
      }
      .planet-info h2 {
        font-size: 1rem;
        font-weight: 400;
        margin-bottom: 0.75rem;
        color: #ffc864;
      }
      .planet-info .info-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        margin: 0.35rem 0;
        opacity: 0.85;
      }
      .planet-info .info-label {
        color: #aaa;
      }
      .planet-info .info-value {
        color: #fff;
        font-variant-numeric: tabular-nums;
      }
      .speed-control {
        position: fixed;
        bottom: 20px;
        left: 20px;
        color: #fff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1rem 1.5rem;
        z-index: 10;
      }
      .speed-control label {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: 0.85rem;
      }
      .speed-control input[type="range"] {
        flex: 1;
        max-width: 200px;
        accent-color: #ffc864;
      }
      .speed-control .speed-value {
        font-variant-numeric: tabular-nums;
        color: #ffc864;
        min-width: 3.5rem;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="ui-overlay">
      <h1>Solar System Simulator</h1>
      <div class="controls">
        <kbd>Mouse Drag</kbd> Rotate | <kbd>Scroll</kbd> Zoom | <kbd>Shift + Drag</kbd> Pan
      </div>
    </div>
    <div class="planet-info" id="planetInfo">
      <h2 id="planetName">Earth</h2>
      <div class="info-row">
        <span class="info-label">Distance from Sun</span>
        <span class="info-value" id="distance">1.00 AU
      </div>
      <div class="info-row">
        <span class="info-label">Orbital Period</span>
        <span class="info-value" id="orbitalPeriod">365.25 days
      </div>
      <div class="info-row">
        <span class="info-label">Rotation Period</span>
        <span class="info-value" id="rotationPeriod">24.00 hours
      </div>
      <div class="info-row">
        <span class="info-label">Radius</span>
        <span class="info-value" id="radius">6,371 km
      </div>
    </div>
    <div class="speed-control">
      <label>
        <span>Simulation Speed</span>
        <input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1" />
        <span class="speed-value" id="speedValue">1.00x</span>
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
