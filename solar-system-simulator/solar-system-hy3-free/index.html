<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Simulator</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        color: rgba(255, 255, 255, 0.55);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 13px;
        letter-spacing: 0.02em;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <p class="hint">Drag to orbit / Scroll to zoom / Right-drag to pan</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
